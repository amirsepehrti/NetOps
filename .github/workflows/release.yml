name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Exists and is Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/NetOps-Mobile.apk || cp NetOps-Mobile.apk release-artifacts/NetOps-Mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOps-Mobile-APK
          path: release-artifacts/NetOps-Mobile.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: NetOps Mobile v1.1.0 Release
          body: |
            ### NetOps Mobile Official Android APK Release
            - Skeuomorphic Rack Console & Aluminum Industrial Themes
            - Unified Incident & Diagnostic Alert Guardian
            - Dynamic Top/Bottom Dock Navigation
            - Zero-Lag 60 FPS View Swapping
            - System Backup & Restore Engine
          files: release-artifacts/NetOps-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
