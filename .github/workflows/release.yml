name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/NetOps-Mobile.apk || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: NetOps Mobile Release
          body: |
            ### NetOps Mobile Official Android APK Release
            - Skeuomorphic Rack Console & Aluminum Industrial Themes
            - Unified Incident & Diagnostic Alert Guardian
            - Dynamic Top/Bottom Dock Navigation
            - Zero-Lag 60 FPS View Swapping
            - System Backup & Restore Engine
          files: release-artifacts/NetOps-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
