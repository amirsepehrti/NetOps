name: Build & Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Exists and is Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Resolve App Version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]\{1,\}\).*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION_NAME}"
          fi
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Building NetOps Mobile ${VERSION_NAME} (versionCode ${VERSION_CODE}) as ${TAG}"

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 -d > my-upload-key.jks
            echo "Signing with the upload keystore from repository secrets."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set - the APK will be signed with a debug key and cannot be uploaded to Google Play."
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK Artifact
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)
          if [ -z "${APK}" ]; then
            echo "::error::Gradle finished without producing an APK in app/build/outputs/apk/release"
            exit 1
          fi
          mkdir -p release-artifacts
          VERSIONED="release-artifacts/NetOps-Mobile-${{ steps.version.outputs.version_name }}.apk"
          cp "${APK}" "${VERSIONED}"
          # Keep the unversioned name too so existing download links stay valid.
          cp "${APK}" release-artifacts/NetOps-Mobile.apk
          echo "versioned_name=$(basename "${VERSIONED}")" >> "$GITHUB_OUTPUT"
          ls -la release-artifacts

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOps-Mobile-${{ steps.version.outputs.version_name }}-APK
          path: release-artifacts/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NetOps Mobile ${{ steps.version.outputs.tag }} Release
          body: |
            ### NetOps Mobile Official Android APK Release

            **Version ${{ steps.version.outputs.version_name }}** (versionCode ${{ steps.version.outputs.version_code }})

            Built from `${{ github.sha }}`.

            #### Included in this build
            - Skeuomorphic Rack Console & Aluminum Industrial Themes
            - Unified Incident & Diagnostic Alert Guardian
            - Dynamic Top/Bottom Dock Navigation
            - Zero-Lag 60 FPS View Swapping
            - System Backup & Restore Engine
            - Upgraded DNS lookup and network monitoring
            - Site customization and UI settings

            #### Install
            Download `${{ steps.apk.outputs.versioned_name }}` and install it on Android 7.0 (API 24) or newer.
          files: |
            release-artifacts/NetOps-Mobile-${{ steps.version.outputs.version_name }}.apk
            release-artifacts/NetOps-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
